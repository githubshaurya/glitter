[project]
name = "glitter-paper"
version = "0.1.0"
description = "Auditable agent-vetted Alpaca paper trading"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx[socks]>=0.28,<1",
  "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
glitter-cycle = "trading.main:cycle"
glitter-serve = "trading.main:serve"
glitter-check = "trading.main:check"
glitter-report = "trading.reporting:main"
glitter-experiment = "trading.experiments:main"
glitter-halt = "trading.main:halt"
glitter-commission = "trading.commissioning:main"
glitter-public-replay = "trading.public_replay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

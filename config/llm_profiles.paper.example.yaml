# Public configuration used by the measured paper run. No credentials.
profiles:
  primary:
    provider: openai_compat
    model: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    tool_calling: native
    options:
      max_tokens_param: max_completion_tokens
      reasoning_effort: low
      response_format:
        type: json_object
      structured_outputs: true
    pricing:
      input: 0.15
      output: 0.6
      cache_read: 0.075
      cache_write: null
    timeout_seconds: 20.0
    max_retries: 0
    api_key_env: GROQ_API_KEY
  intraday_critic:
    provider: openai_compat
    model: qwen/qwen3.8-27b
    base_url: https://api.groq.com/openai/v1
    tool_calling: native
    options:
      max_tokens_param: max_completion_tokens
      reasoning_effort: none
      structured_outputs: true
    pricing: {input: 0.8, output: 4.0}
    timeout_seconds: 20.0
    max_retries: 0
    api_key_env: GROQ_API_KEY
  shadow_b:
    provider: openai_compat
    model: openai/gpt-oss-20b
    base_url: https://api.groq.com/openai/v1
    tool_calling: native
    options:
      max_tokens_param: max_completion_tokens
      reasoning_effort: low
      response_format:
        type: json_object
      structured_outputs: true
    pricing:
      input: 0.075
      output: 0.3
      cache_read: 0.0375
      cache_write: null
    timeout_seconds: 20.0
    max_retries: 0
    api_key_env: GROQ_API_KEY

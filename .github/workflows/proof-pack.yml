name: Export proof pack
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'UTC start (ISO8601, optional: defaults to first journal observation)'
        required: false
      end:
        description: 'UTC end (ISO8601, optional: defaults to now)'
        required: false
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REPORT_START: ${{ inputs.start }}
      REPORT_END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
      - run: uv sync --frozen --no-dev
      - run: uv run glitter-report
      - uses: actions/upload-artifact@v4
        with:
          name: glitter-proof-pack
          path: reports/latest/
          retention-days: 30
          if-no-files-found: error

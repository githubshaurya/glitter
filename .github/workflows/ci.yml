name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: glitter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: SQLite unit and failure tests
        run: uv run pytest
      - name: PostgreSQL coordination and failure tests
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/glitter_test
      - name: Frontend syntax
        run: node --check trading/static/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Build and start the documented Docker service
        shell: bash
        run: |
          docker build -t glitter-paper:ci .
          docker volume create glitter-ci-data
          docker run -d --name glitter-ci -p 127.0.0.1:8000:8000 -v glitter-ci-data:/app/data -e DASHBOARD_TOKEN=synthetic-ci-token glitter-paper:ci
          trap 'docker logs glitter-ci; docker rm -f glitter-ci; docker volume rm glitter-ci-data' EXIT
          curl --silent --show-error --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/overview)" = '401'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer synthetic-ci-token' http://127.0.0.1:8000/readyz)" = '503'
          curl --fail -H 'Authorization: Bearer synthetic-ci-token' -H 'Content-Type: application/json' -d '{"mode":"HALTED","reason":"Docker persistence verification"}' http://127.0.0.1:8000/api/control
          docker stop glitter-ci
          docker rm glitter-ci
          docker run -d --name glitter-ci -p 127.0.0.1:8000:8000 -v glitter-ci-data:/app/data -e DASHBOARD_TOKEN=synthetic-ci-token glitter-paper:ci
          curl --silent --show-error --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8000/healthz
          curl --silent --fail -H 'Authorization: Bearer synthetic-ci-token' http://127.0.0.1:8000/api/overview | python -c 'import json,sys; assert json.load(sys.stdin)["control"]["mode"] == "HALTED"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-evidence
          path: test-results/
          if-no-files-found: ignore

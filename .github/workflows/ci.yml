name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: glitter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: SQLite unit and failure tests
        run: uv run pytest
      - name: PostgreSQL coordination and failure tests
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/glitter_test
      - name: Frontend syntax
        run: node --check trading/static/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-evidence
          path: test-results/
          if-no-files-found: ignore

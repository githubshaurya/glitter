name: Paper trading
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpaca-paper-account
  cancel-in-progress: false
jobs:
  cycle:
    # Configure secrets and a persistent PostgreSQL DB first, then enable this repository variable.
    if: vars.TRADING_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXECUTION_ENABLED: 'true'
      AGENT_ACCOUNT_CONTEXT_ENABLED: ${{ vars.AGENT_ACCOUNT_CONTEXT_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Verify persistent database configuration
        shell: bash
        run: |
          case "$DATABASE_URL" in
            postgresql*|postgres://*) ;;
            *) echo 'Scheduled workers require persistent PostgreSQL, not local SQLite'; exit 1 ;;
          esac
      - run: uv run glitter-cycle
